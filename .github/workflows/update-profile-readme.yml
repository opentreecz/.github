name: Update Profile README

on:
  schedule:
    - cron: '0 6 * * *'
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate repository table
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch all public repos for the organization
          REPOS=$(curl -s \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/orgs/opentreecz/repos?per_page=100&sort=updated&type=public")

          # Build the markdown table for original projects (non-forks)
          ORIGINAL_TABLE=""
          FORK_TABLE=""

          while IFS= read -r line; do
            name=$(echo "$line" | jq -r '.name')
            url=$(echo "$line" | jq -r '.html_url')
            desc=$(echo "$line" | jq -r '.description // "-"')
            lang=$(echo "$line" | jq -r '.language // "-"')
            is_fork=$(echo "$line" | jq -r '.fork')

            # Skip the .github repo itself
            if [ "$name" = ".github" ]; then
              continue
            fi

            row="| [${name}](${url}) | ${desc} | ${lang} |"

            if [ "$is_fork" = "true" ]; then
              FORK_TABLE="${FORK_TABLE}${row}\n"
            else
              ORIGINAL_TABLE="${ORIGINAL_TABLE}${row}\n"
            fi
          done < <(echo "$REPOS" | jq -c '.[]')

          # Combine tables
          FULL_TABLE="### Original Projects\n\n"
          FULL_TABLE+="| Repository | Description | Language |\n"
          FULL_TABLE+="|------------|-------------|----------|\n"
          FULL_TABLE+="${ORIGINAL_TABLE}\n"
          FULL_TABLE+="### Forks and Contributions\n\n"
          FULL_TABLE+="| Repository | Description | Language |\n"
          FULL_TABLE+="|------------|-------------|----------|\n"
          FULL_TABLE+="${FORK_TABLE}"

          # Write to a temp file for awk processing
          echo -e "$FULL_TABLE" > /tmp/repo_table.md

          # Replace content between markers in README
          awk '
            /<!-- REPOS:START -->/ {
              print
              print "<!-- This section is auto-generated by GitHub Actions. Do not edit manually. -->"
              while ((getline line < "/tmp/repo_table.md") > 0) {
                print line
              }
              skip = 1
              next
            }
            /<!-- REPOS:END -->/ {
              skip = 0
            }
            !skip { print }
          ' profile/README.md > profile/README.md.tmp
          mv profile/README.md.tmp profile/README.md

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/README.md
          git diff --cached --quiet || git commit -m "chore: update repository list in profile README"
          git push
